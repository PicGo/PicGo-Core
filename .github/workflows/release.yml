name: release
permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - master
      - alpha
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'npm tag to publish with (default: latest)'
        required: false
        default: 'latest'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-25-pnpm-11.7.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-25-pnpm-11.7.0-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Unset NODE_AUTH_TOKEN
        run: unset NODE_AUTH_TOKEN

      - name: Publish (master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm publish --access public --provenance

      - name: Publish (alpha)
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        run: npm publish --tag alpha --access public --provenance

      - name: Publish (manual)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --tag "${{ inputs.publish_tag || 'latest' }}" --access public --provenance
